set -g status-position top
set -g status-keys vi
setw -g mode-keys vi
set -g mouse on
set -g set-clipboard external
set -g focus-events on
set -g status-style 'bg=default,fg=#eceff4'
set -g message-style 'bg=default,fg=#eceff4'
set -g message-command-style 'bg=default,fg=#eceff4'

set -g status 2
set -g status-format[1] ''

set -g status-left ''
set -g status-right ''
setw -g window-status-format ' #W '
setw -g window-status-style 'fg=#616e88'
setw -g window-status-current-format '[#W]'
setw -g window-status-current-style 'bold,fg=#81a1c1'

bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-l next-window
bind -n M-h previous-window
bind -n M-W kill-pane
bind -n M-B split-window -v -c "#{pane_current_path}"
bind -n M-V split-window -h -c "#{pane_current_path}"
bind -n M-H if-shell '[ #{pane_at_left} -eq 0 ]' 'select-pane -L'
bind -n M-L if-shell '[ #{pane_at_right} -eq 0 ]' 'select-pane -R'
bind -n M-K if-shell '[ #{pane_at_top} -eq 0 ]' 'select-pane -U'
bind -n M-J if-shell '[ #{pane_at_bottom} -eq 0 ]' 'select-pane -D'
bind -n M-v copy-mode
bind -T copy-mode M-u send-keys -X page-up
bind -T copy-mode M-d send-keys -X page-down
bind-key -T copy-mode-vi y send-keys -X copy-selection

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -n M-< command-prompt -I "#W" "rename-window '%%'"

set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

set -g pane-border-lines heavy
set -g pane-border-format ''
set -g pane-border-style 'fg=#4c566a'
set -g pane-active-border-style 'fg=#a3be8c,bold'
